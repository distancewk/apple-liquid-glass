<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass · 聊天</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="shared.css" />
    <style>
      :root { color-scheme: light; --bg: #f5f5f7; --surface: #fff; --label: #1d1d1f; --secondary: #6e6e73; --separator: #d2d2d7; --tint: #1677e8; background: var(--bg); color: var(--label); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      body { min-height: 168vh; background: var(--bg); }.layout { display: grid; grid-template-columns: 240px minmax(0, 680px); gap: 72px; width: min(1040px, calc(100% - 48px)); min-height: 100vh; margin: 0 auto; padding: 38px 0 132px; }.threads { align-self: start; position: sticky; top: 34px; }.threads h1 { margin: 0 0 22px; font-size: 25px; letter-spacing: -.04em; }.thread { display: flex; width: 100%; gap: 12px; align-items: center; min-height: 62px; border: 0; border-bottom: 1px solid var(--separator); background: transparent; color: inherit; text-align: left; }.avatar { display: grid; width: 36px; height: 36px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #e5e5ea; color: var(--secondary); font-size: 14px; }.thread.is-selected b { color: var(--tint); }.thread b, .thread small { display: block; }.thread b { font-size: 14px; }.thread small { margin-top: 3px; color: var(--secondary); font-size: 12px; }.conversation { min-width: 0; }.conversation-header { display: flex; align-items: end; justify-content: space-between; margin: 8px 0 40px; }.conversation-header p { margin: 0 0 6px; color: var(--secondary); font-size: 13px; }.conversation-header h2 { margin: 0; font-size: 37px; letter-spacing: -.055em; }.info { display: grid; width: 44px; height: 44px; place-items: center; border: 1px solid var(--separator); border-radius: 50%; background: var(--surface); font-size: 20px; }.messages { display: grid; gap: 17px; }.message { max-width: 76%; padding: 14px 17px; border-radius: 20px 20px 20px 6px; background: var(--surface); box-shadow: 0 6px 15px rgba(0,0,0,.06); line-height: 1.45; }.message.me { justify-self: end; border-radius: 20px 20px 6px 20px; background: #e8f2ff; }.message p { margin: 0; }.message time { display: block; margin-top: 6px; color: var(--secondary); font-size: 11px; }.divider { margin: 22px 0 2px; color: var(--secondary); font-size: 12px; text-align: center; }.attachment { padding: 0; overflow: hidden; }.attachment img { display: block; width: 100%; height: 180px; object-fit: cover; }.attachment p, .attachment time { margin-right: 17px; margin-left: 17px; }.attachment p { margin-top: 13px; }.attachment time { margin-bottom: 13px; }
      .composer { position: fixed; z-index: 3; bottom: 24px; left: 50%; width: min(680px, calc(100% - 48px)); --border-radius: 24px; transform: translateX(-50%); color: var(--label); }.composer .liquid_glass-content { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; }.composer button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 22px; }.composer button:hover { background: rgba(255,255,255,.34); }.composer input { min-height: 44px; border: 0; outline: 0; background: transparent; color: var(--label); font: inherit; }.composer input::placeholder { color: var(--secondary); }.composer .send { background: var(--tint); color: #fff; font-size: 15px; }.composer button:active { transform: scale(.94); } button:focus-visible, input:focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }
      @media (max-width: 760px) { .layout { display: block; width: min(100% - 32px, 620px); padding-top: 24px; }.threads { position: relative; top: auto; margin-bottom: 44px; }.threads h1 { margin-bottom: 12px; }.thread { display: inline-flex; width: auto; margin-right: 13px; border: 0; }.thread span:last-child { display: none; }.conversation-header { margin-bottom: 30px; }.message { max-width: 88%; }.composer { right: 12px; bottom: 12px; left: 12px; width: auto; transform: none; } }
    </style>
  </head>
  <body>
    <svg class="liquid-filter" aria-hidden="true"><defs><filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feDisplacementMap scale="200" /></filter></defs></svg>
    <main class="layout"><aside class="threads" aria-label="会话列表"><h1>消息</h1><button class="thread is-selected" type="button"><span class="avatar">林</span><span><b>林夏</b><small>我已经把草图放进来了</small></span></button><button class="thread" type="button"><span class="avatar">周</span><span><b>周末计划</b><small>还有一个小时出发</small></span></button><button class="thread" type="button"><span class="avatar">设</span><span><b>工作室</b><small>新反馈 · 3</small></span></button></aside><section class="conversation" aria-labelledby="chat-title"><header class="conversation-header"><div><p>今天 · 设计讨论</p><h2 id="chat-title">林夏</h2></div><button class="info" type="button" aria-label="会话信息">ⓘ</button></header><div class="messages" id="messages"><article class="message"><p>封面不必承担所有解释。我们先让它建立情绪，再把信息留给下面。</p><time>09:14</time></article><article class="message me"><p>同意。我把标题移出图片，让读者先看到当前的选择。</p><time>09:16</time></article><article class="message attachment"><img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=85" alt="明亮的工作室参考照片" /><p>这是上午整理的参考方向。</p><time>09:21</time></article><p class="divider">下午 2:08</p><article class="message"><p>那底部操作区可以保持悬浮，让内容从它下面通过。</p><time>14:08</time></article><article class="message me"><p>好，我用一个共享输入区，而不是把每个按钮都做成玻璃。</p><time>14:10</time></article></div></section></main>
    <form class="composer liquid_glass-wrapper" data-glass-shape="rounded" aria-label="发送消息"><div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div><div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div><div class="liquid_glass-content"><button type="button" aria-label="添加内容">＋</button><input id="message" aria-label="消息" placeholder="发送消息" /><button class="send" type="submit" aria-label="发送">↑</button></div></form>
    <script>const form=document.querySelector('.composer'),input=document.querySelector('#message'),messages=document.querySelector('#messages');form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text)return;const item=document.createElement('article');item.className='message me';item.innerHTML='<p></p><time>刚刚</time>';item.querySelector('p').textContent=text;messages.append(item);input.value='';item.scrollIntoView({behavior:'smooth',block:'end'})});</script>
  </body>
</html>
