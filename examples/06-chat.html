<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass · 聊天</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      :root { color-scheme: light; color: #1b1d25; background: #f4f1ec; } body { min-height: 170vh; background: linear-gradient(180deg, #fbf9f5, #efeae3); }.chat-layout { display: grid; grid-template-columns: 260px minmax(0, 720px); width: min(1100px, calc(100% - 48px)); min-height: 100vh; gap: 70px; margin: 0 auto; padding: 40px 0 140px; }.threads { align-self: start; position: sticky; top: 36px; }.threads h1 { margin: 0 0 26px; font-size: 25px; letter-spacing: -.04em; }.thread { display: flex; width: 100%; align-items: center; gap: 12px; border: 0; border-bottom: 1px solid rgba(27,29,37,.12); padding: 13px 1px; background: transparent; color: inherit; text-align: left; }.thread:hover, .thread.is-selected { color: #526c99; }.avatar { display: grid; width: 38px; height: 38px; flex: 0 0 auto; place-items: center; border-radius: 50%; background: #f2c6a8; font-size: 16px; }.avatar.cool { background: #a9d2d3; }.avatar.lilac { background: #d5c0e6; }.thread span:last-child { display: grid; gap: 3px; min-width: 0; }.thread b { font-size: 14px; }.thread small { overflow: hidden; color: #6e7079; font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }.conversation { min-width: 0; }.conversation-header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 8px 0 44px; }.conversation-header p { margin: 0 0 5px; color: #6d707a; font-size: 13px; }.conversation-header h2 { margin: 0; font-size: clamp(31px, 4vw, 45px); letter-spacing: -.06em; }.conversation-header button { width: 44px; height: 44px; border: 1px solid rgba(27,29,37,.16); border-radius: 50%; background: rgba(255,255,255,.54); font-size: 22px; }.messages { display: grid; gap: 18px; }.message { max-width: 74%; padding: 15px 18px; border-radius: 20px 20px 20px 6px; background: #fff; box-shadow: 0 8px 18px rgba(30,27,35,.06); line-height: 1.48; }.message.me { justify-self: end; border-radius: 20px 20px 6px 20px; background: #dae5fb; }.message p { margin: 0; }.message time { display: block; margin-top: 7px; color: #777b88; font-size: 11px; }.divider { margin: 34px 0 8px; color: #777b88; font-size: 12px; text-align: center; }.photo { width: min(100%, 390px); padding: 0; overflow: hidden; background: linear-gradient(145deg, #fbc48f, #e58ca4 48%, #748ab9); }.photo::before { display: block; height: 180px; background: radial-gradient(circle at 26% 25%, rgba(255,255,255,.85) 0 3%, transparent 3.5%), linear-gradient(125deg, transparent 0 44%, rgba(74,74,110,.44) 45% 65%, transparent 66%), repeating-linear-gradient(105deg, rgba(255,255,255,.18) 0 4px, transparent 5px 23px); content: ""; }.photo p { padding: 13px 16px; background: #fff; }.composer { position: fixed; z-index: 3; bottom: 24px; left: 50%; width: min(720px, calc(100% - 48px)); --border-radius: 25px; transform: translateX(-50%); }.composer .liquid_glass-content { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 8px; }.composer button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: #28334c; font-size: 22px; }.composer button:hover { background: rgba(255,255,255,.42); }.composer button:active { transform: scale(.94); }.composer input { width: 100%; min-height: 44px; border: 0; outline: 0; background: transparent; color: #1d2534; font: inherit; }.send { background: #294a82 !important; color: #fff !important; font-size: 14px !important; } button:focus-visible, input:focus-visible { outline: 3px solid #426ba8; outline-offset: 3px; }
      @media (max-width: 760px) { .chat-layout { display: block; width: min(100% - 30px, 620px); padding-top: 24px; }.threads { position: relative; top: auto; margin-bottom: 46px; }.threads h1 { margin-bottom: 13px; }.thread { display: inline-flex; width: auto; margin-right: 12px; border: 0; }.thread span:last-child { display: none; }.conversation-header { margin-bottom: 30px; }.message { max-width: 88%; }.composer { right: 12px; bottom: 12px; left: 12px; width: auto; transform: none; }.composer .liquid_glass-content { grid-template-columns: auto minmax(0, 1fr) auto; }.photo::before { height: 150px; } }
    </style>
  </head>
  <body>
    <svg class="liquid-filter" aria-hidden="true"><defs><filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feDisplacementMap scale="200" /></filter></defs></svg>
    <main class="chat-layout"><aside class="threads" aria-label="会话列表"><h1>消息</h1><button class="thread is-selected" type="button"><span class="avatar">林</span><span><b>林夏</b><small>我已经把草图放进来了</small></span></button><button class="thread" type="button"><span class="avatar cool">周</span><span><b>周末计划</b><small>还有一个小时出发</small></span></button><button class="thread" type="button"><span class="avatar lilac">设</span><span><b>工作室</b><small>新反馈 · 3</small></span></button></aside><section class="conversation" aria-labelledby="chat-title"><header class="conversation-header"><div><p>今天 · 设计讨论</p><h2 id="chat-title">林夏</h2></div><button type="button" aria-label="会话信息">ⓘ</button></header><div class="messages" id="messages"><article class="message"><p>封面不必承担所有解释。我们先让它建立情绪，再把信息留给下面。</p><time>09:14</time></article><article class="message me"><p>同意。我把标题移出图片，让读者先看到当前的选择。</p><time>09:16</time></article><article class="message photo"><div aria-hidden="true"></div><p>这是上午的方向。光线和留白都很克制。</p><time>09:21</time></article><p class="divider">下午 2:08</p><article class="message"><p>那底部操作区可以保持悬浮，让内容从它下面通过。这样材质才有存在的理由。</p><time>14:08</time></article><article class="message me"><p>好，我用一个共享输入区，而不是把每个按钮都做成玻璃。</p><time>14:10</time></article></div></section></main>
    <form class="composer liquid_glass-wrapper" data-glass-shape="rounded" data-glass-tone="light" aria-label="发送消息"><div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div><div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div><div class="liquid_glass-content"><button type="button" aria-label="添加内容">＋</button><input id="message" aria-label="消息" placeholder="发送消息" /><button class="send" type="submit" aria-label="发送">↑</button></div></form>
    <script>const form=document.querySelector('.composer'),input=document.querySelector('#message'),messages=document.querySelector('#messages');form.addEventListener('submit',event=>{event.preventDefault();const text=input.value.trim();if(!text)return;const item=document.createElement('article');item.className='message me';item.innerHTML='<p></p><time>刚刚</time>';item.querySelector('p').textContent=text;messages.append(item);input.value='';item.scrollIntoView({behavior:'smooth',block:'end'})});</script>
  </body>
</html>
