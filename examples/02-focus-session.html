<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>专注计时 — Apple Liquid Glass 案例</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      :root { color-scheme: dark; }
      body { display: grid; min-height: 100vh; place-items: center; overflow: hidden; color: rgba(255,255,255,.92); background: radial-gradient(circle at 18% 20%, rgba(143,162,125,.58) 0 7%, transparent 26%), radial-gradient(circle at 84% 74%, rgba(201,152,100,.4) 0 8%, transparent 29%), linear-gradient(135deg, #20261f, #566151 48%, #2e3531); }
      .desk { position: relative; width: min(1100px, 92vw); min-height: min(720px, 88vh); }
      .note { position: absolute; width: 220px; padding: 24px; color: rgba(21,28,22,.72); background: rgba(237,234,219,.8); box-shadow: 0 20px 60px rgba(0,0,0,.13); }
      .note small { font-size: 11px; letter-spacing: .12em; }
      .note strong { display: block; margin-top: 50px; font-size: 23px; font-weight: 500; letter-spacing: -.05em; line-height: 1.1; }
      .note-a { top: 8%; left: 4%; border-radius: 10px 34px 10px 34px; transform: rotate(-5deg); }
      .note-b { right: 5%; bottom: 10%; border-radius: 34px 10px 34px 10px; transform: rotate(5deg); background: rgba(210,222,211,.78); }
      .note-b ul { display: grid; gap: 11px; padding: 0; margin: 24px 0 0; list-style: none; font-size: 13px; }
      .note-b li::before { content: "✓"; margin-right: 8px; color: #43614a; }
      .focus-stage { position: absolute; inset: 50% auto auto 50%; display: grid; width: min(410px, 72vw); aspect-ratio: 1; place-items: center; transform: translate(-50%, -50%); }
      .orbit { position: absolute; inset: 4%; border: 1px solid rgba(255,255,255,.2); border-radius: 50%; }
      .orbit::before, .orbit::after { position: absolute; width: 10px; height: 10px; border-radius: 50%; content: ""; background: #f0d697; box-shadow: 0 0 18px #f0d697; }
      .orbit::before { top: 9%; left: 15%; } .orbit::after { right: 11%; bottom: 14%; background: #c6d8bd; box-shadow: 0 0 18px #c6d8bd; }
      .focus-copy { position: relative; z-index: 1; text-align: center; }
      .focus-copy small { color: rgba(255,255,255,.62); font-size: 12px; letter-spacing: .14em; }
      .focus-copy h1 { margin: 11px 0 8px; font-size: clamp(58px, 9vw, 88px); font-weight: 500; letter-spacing: -.08em; line-height: .9; }
      .focus-copy p { margin: 0; color: rgba(255,255,255,.68); }
      .focus-control { width: 112px; height: 112px; margin-top: 30px; --border-radius: 50%; border: 0; color: white; background: transparent; }
      .focus-control .liquid_glass-content { display: grid; width: 100%; height: 100%; place-items: center; font-size: 28px; }
      .focus-control:hover .liquid_glass-cover { background: rgba(0,0,0,.2); }
      .focus-control:active { transform: scale(.96); }
      .focus-control:focus-visible { outline: 3px solid white; outline-offset: 5px; }
      .session-label { position: absolute; right: 7%; top: 9%; display: grid; gap: 5px; text-align: right; }
      .session-label small { color: rgba(255,255,255,.55); } .session-label strong { font-size: 15px; }
      .status { position: absolute; bottom: 7%; left: 50%; min-height: 20px; transform: translateX(-50%); color: rgba(255,255,255,.64); font-size: 12px; white-space: nowrap; }
      @media (max-width: 680px) { .desk { min-height: 720px; } .note { width: 150px; padding: 17px; } .note strong { margin-top: 28px; font-size: 18px; } .note-a { left: -3%; } .note-b { right: -3%; } .session-label { right: 3%; top: 4%; } }
    </style>
  </head>
  <body>
    <svg class="liquid-filter" style="display:none" aria-hidden="true"><defs><filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feDisplacementMap scale="200" /></filter></defs></svg>
    <main class="desk" aria-labelledby="focus-title">
      <article class="note note-a"><small>09:00 — 09:25</small><strong>先把首页结构整理好。</strong></article>
      <article class="note note-b"><small>下一步</small><ul><li>收集灵感</li><li>写下第一版</li><li>留出空白</li></ul></article>
      <div class="session-label"><small>今天的专注</small><strong>2 小时 10 分</strong></div>
      <section class="focus-stage" aria-label="专注计时"><div class="orbit" aria-hidden="true"></div><div class="focus-copy"><small>正在专注</small><h1 id="focus-title">24:37</h1><p>整理首页结构</p><button class="liquid_glass-wrapper focus-control" data-glass-shape="circle" type="button" aria-pressed="false" aria-label="暂停专注"><span class="liquid_glass-outer"></span><span class="liquid_glass-cover"></span><span class="liquid_glass-sharp"></span><span class="liquid_glass-reflect"></span><span class="liquid_glass-content" aria-hidden="true">Ⅱ</span></button></div></section>
      <p class="status" role="status" aria-live="polite">计时正在进行</p>
    </main>
    <script>
      const control = document.querySelector('.focus-control'); const title = document.querySelector('#focus-title'); const status = document.querySelector('.status'); control.addEventListener('click', () => { const paused = control.getAttribute('aria-pressed') === 'true'; control.setAttribute('aria-pressed', String(!paused)); control.setAttribute('aria-label', paused ? '暂停专注' : '继续专注'); control.querySelector('.liquid_glass-content').textContent = paused ? 'Ⅱ' : '▶'; status.textContent = paused ? '计时正在进行' : '已暂停；随时可以继续'; title.style.opacity = paused ? '1' : '.72'; });
    </script>
  </body>
</html>
