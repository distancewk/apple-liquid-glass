<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass · 音乐播放</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      :root { color-scheme: light; --bg: #f5f5f7; --surface: #fff; --label: #1d1d1f; --secondary: #6e6e73; --separator: #d2d2d7; --tint: #1677e8; background: var(--bg); color: var(--label); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      body { min-height: 178vh; background: var(--bg); }
      .page { width: min(980px, calc(100% - 48px)); margin: 0 auto; padding: 30px 0 174px; }
      .topline { display: flex; align-items: center; justify-content: space-between; min-height: 44px; color: var(--secondary); font-size: 14px; }.topline b { color: var(--label); font-size: 17px; }.topline p { margin: 0; }
      .hero { display: grid; grid-template-columns: minmax(260px, .9fr) minmax(300px, 1.1fr); gap: clamp(32px, 8vw, 92px); align-items: center; margin: 62px 0 74px; }.album-art { overflow: hidden; aspect-ratio: 1; background: #d8d8dc; }.album-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
      .eyebrow { margin: 0 0 10px; color: var(--secondary); font-size: 15px; }.intro h1 { margin: 0; font-size: clamp(40px, 5vw, 58px); letter-spacing: -.055em; line-height: 1; }.intro h2 { margin: 10px 0 28px; color: var(--secondary); font-size: 21px; font-weight: 500; }.intro p:last-child { max-width: 370px; margin: 0; color: var(--secondary); font-size: 17px; line-height: 1.45; }
      .queue { overflow: hidden; border: 1px solid var(--separator); border-radius: 20px; background: var(--surface); }.queue h2 { margin: 0; padding: 20px 22px 13px; font-size: 17px; }.track { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; min-height: 62px; border: 0; border-top: 1px solid var(--separator); padding: 0 22px; background: transparent; color: inherit; text-align: left; }.track b { font-size: 16px; }.track span, .track small { color: var(--secondary); font-size: 14px; }.track.is-playing { background: #e8f2ff; }.track.is-playing b, .track.is-playing span { color: var(--tint); }.track:focus-visible { position: relative; outline: 3px solid var(--tint); outline-offset: -3px; }
      .artwork-note { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 22px; align-items: center; margin-top: 74px; padding: 26px; background: var(--surface); }.artwork-note img { width: 150px; aspect-ratio: 1; object-fit: cover; }.artwork-note h2 { margin: 0 0 7px; font-size: 22px; }.artwork-note p { margin: 0; color: var(--secondary); line-height: 1.45; }
      .transport { position: fixed; z-index: 3; right: max(24px, calc((100vw - 980px) / 2)); bottom: 24px; left: max(24px, calc((100vw - 980px) / 2)); min-height: 78px; --border-radius: 24px; color: var(--label); }.transport .liquid_glass-content { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(180px, .85fr); gap: 18px; align-items: center; padding: 12px 18px; }.now { min-width: 0; }.now b, .now span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }.now span { color: var(--secondary); font-size: 12px; }.now b { margin-top: 3px; font-size: 15px; }.controls { display: flex; gap: 6px; }.controls button { display: grid; width: 44px; height: 44px; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--label); font-size: 18px; }.controls button:hover { background: rgba(255,255,255,.35); }.controls button:active { transform: scale(.94); }.controls .play { background: var(--tint); color: #fff; }.timeline { display: grid; grid-template-columns: 30px minmax(72px, 1fr) 30px; gap: 8px; align-items: center; color: var(--secondary); font-size: 11px; }.timeline input { width: 100%; accent-color: var(--tint); }
      @media (max-width: 700px) { .page { width: min(100% - 32px, 560px); padding-top: 18px; }.hero { grid-template-columns: 1fr; gap: 28px; margin: 34px 0 44px; }.album-art { width: min(100%, 430px); margin: 0 auto; }.intro { text-align: center; }.intro h2 { margin-bottom: 18px; }.intro p:last-child { margin: auto; }.artwork-note { grid-template-columns: 92px minmax(0, 1fr); gap: 16px; margin-top: 42px; padding: 16px; }.artwork-note img { width: 92px; }.artwork-note h2 { font-size: 18px; }.transport { right: 12px; bottom: 12px; left: 12px; }.transport .liquid_glass-content { grid-template-columns: minmax(0, 1fr) auto; }.timeline { display: none; } }
    </style>
  </head>
  <body>
    <svg class="liquid-filter" aria-hidden="true"><defs><filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feDisplacementMap scale="200" /></filter></defs></svg>
    <main class="page">
      <header class="topline"><b>音乐</b><p>资料库</p></header>
      <section class="hero" aria-labelledby="album-title"><div class="album-art"><img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=1000&q=85" alt="Warm Signal 专辑封面" /></div><div class="intro"><p class="eyebrow">正在播放</p><h1 id="album-title">Warm Signal</h1><h2>Daylight Radio</h2><p>内容用专辑封面建立情绪；持续可用的播放控制保持在底部，并让正在浏览的内容从其下方经过。</p></div></section>
      <section class="queue" aria-labelledby="queue-title"><h2 id="queue-title">接下来播放</h2><button class="track is-playing" type="button"><span>01</span><b>Dawn, softly</b><small>3:42</small></button><button class="track" type="button"><span>02</span><b>Half-light</b><small>4:06</small></button><button class="track" type="button"><span>03</span><b>After rain</b><small>3:18</small></button></section>
      <article class="artwork-note"><img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?auto=format&fit=crop&w=600&q=85" alt="现场演出照片" /><div><h2>现场录音</h2><p>来自春季巡演的节选。封面与演出图是媒体内容，界面本身维持中性层级。</p></div></article>
    </main>
    <section class="transport liquid_glass-wrapper" data-glass-shape="rounded" aria-label="播放控制"><div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div><div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div><div class="liquid_glass-content"><div class="now"><span>Warm Signal · Daylight Radio</span><b id="track-name">Dawn, softly</b></div><div class="controls"><button type="button" aria-label="上一首">‹</button><button class="play" id="play" type="button" aria-label="播放">▶</button><button type="button" aria-label="下一首">›</button></div><label class="timeline"><span>0:38</span><input aria-label="播放进度" type="range" value="28" /><span>3:42</span></label></div></section>
    <script>const play=document.querySelector('#play');play.addEventListener('click',()=>{const active=play.textContent==='Ⅱ';play.textContent=active?'▶':'Ⅱ';play.setAttribute('aria-label',active?'播放':'暂停')});</script>
  </body>
</html>
