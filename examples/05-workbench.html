<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass · 工作台</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="shared.css" />
    <style>
      :root { color-scheme: light; --bg: #f5f5f7; --surface: #fff; --label: #1d1d1f; --secondary: #6e6e73; --separator: #d2d2d7; --tint: #1677e8; background: var(--bg); color: var(--label); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif; }
      body { min-height: 174vh; background: var(--bg); }.shell { width: min(1080px, calc(100% - 48px)); margin: 0 auto; padding: 30px 0 120px; }.header { display: flex; align-items: center; justify-content: space-between; min-height: 44px; color: var(--secondary); font-size: 14px; }.header h1 { margin: 0; color: var(--label); font-size: 17px; }.header p { margin: 0; }
      .title { margin: 92px 0 34px; }.title p { margin: 0 0 8px; color: var(--secondary); font-size: 15px; }.title h2 { margin: 0; font-size: clamp(34px, 4vw, 48px); letter-spacing: -.05em; line-height: 1.08; }
      .board { display: grid; grid-template-columns: 1.08fr .92fr; min-height: 710px; border: 1px solid var(--separator); border-radius: 24px; overflow: hidden; background: var(--surface); }.canvas { position: relative; min-height: 510px; padding: 32px; border-right: 1px solid var(--separator); background: #fbfbfc; }.canvas h3, .sidebar h3 { margin: 0; font-size: 17px; }.canvas p { margin: 8px 0 0; color: var(--secondary); line-height: 1.45; }.node { position: absolute; display: grid; width: 154px; min-height: 92px; place-items: center; border: 1px solid var(--separator); border-radius: 16px; background: var(--surface); color: var(--secondary); font-size: 14px; text-align: center; }.node.current { border-color: var(--tint); background: #e8f2ff; color: var(--tint); font-weight: 650; }.node.one { top: 190px; left: 12%; }.node.two { top: 322px; left: 36%; }.node.three { top: 192px; right: 10%; }.line { position: absolute; height: 1px; transform-origin: left; background: var(--separator); }.line.a { top: 270px; left: 33%; width: 26%; transform: rotate(25deg); }.line.b { top: 310px; left: 52%; width: 23%; transform: rotate(-28deg); }
      .sidebar { padding: 32px; }.sidebar p { margin: 8px 0 22px; color: var(--secondary); line-height: 1.45; }.file { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 12px; align-items: center; min-height: 64px; border-top: 1px solid var(--separator); }.file i { display: grid; width: 36px; height: 44px; place-items: center; border: 1px solid var(--separator); border-radius: 7px; color: var(--secondary); font-size: 12px; font-style: normal; }.file b, .file span { display: block; }.file b { font-size: 14px; }.file span { margin-top: 3px; color: var(--secondary); font-size: 12px; }
      .toolbar { position: fixed; z-index: 3; top: 24px; left: 50%; width: min(570px, calc(100% - 48px)); --border-radius: 24px; transform: translateX(-50%); color: var(--label); }.toolbar .liquid_glass-content { display: flex; min-height: 56px; align-items: center; padding: 6px; }.tool-group { display: flex; flex: 1; }.tool-group button, .create { min-height: 44px; border: 0; border-radius: 16px; background: transparent; color: inherit; font-weight: 620; }.tool-group button { flex: 1; }.tool-group button.is-active, .tool-group button:hover { background: rgba(255,255,255,.34); }.create { padding: 0 16px; background: var(--tint); color: #fff; }.tool-group button:active, .create:active { transform: scale(.96); } button:focus-visible { outline: 3px solid var(--tint); outline-offset: 3px; }
      @media (max-width: 720px) { .shell { width: min(100% - 32px, 600px); padding-top: 18px; }.title { margin: 78px 0 28px; }.board { grid-template-columns: 1fr; }.canvas { min-height: 550px; border-right: 0; border-bottom: 1px solid var(--separator); }.sidebar { padding: 24px; }.toolbar { top: 12px; width: calc(100% - 24px); }.tool-group button { font-size: 13px; }.create { padding: 0 13px; }.node { width: 130px; }.node.one { left: 6%; }.node.two { left: 31%; }.node.three { right: 5%; }.line.a { left: 30%; }.line.b { left: 49%; } }
    </style>
  </head>
  <body>
    <svg class="liquid-filter" aria-hidden="true"><defs><filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feDisplacementMap scale="200" /></filter></defs></svg>
    <section class="toolbar liquid_glass-wrapper" data-glass-shape="rounded" aria-label="工作台工具栏"><div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div><div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div><div class="liquid_glass-content"><nav class="tool-group" aria-label="视图"><button class="is-active" type="button">画布</button><button type="button">资料</button><button type="button">标注</button></nav><button class="create" id="create" type="button">新建</button></div></section>
    <main class="shell"><header class="header"><h1>项目</h1><p>自动保存</p></header><section class="title"><p>工作台</p><h2>首页信息架构</h2></section><section class="board" aria-label="项目画布"><div class="canvas"><h3>当前关系</h3><p>把需要一起理解的内容放在同一视图内。</p><div class="node one">内容优先</div><i class="line a"></i><div class="node two current">首页结构</div><i class="line b"></i><div class="node three">筛选上下文</div></div><aside class="sidebar"><h3>相关资料</h3><p>普通信息组承载文件；玻璃只承担页面级命令。</p><div class="file"><i>PDF</i><div><b>内容结构</b><span>今天 · 1.2 MB</span></div></div><div class="file"><i>DOC</i><div><b>体验原则</b><span>昨天 · 840 KB</span></div></div><div class="file"><i>JPG</i><div><b>封面参考</b><span>上周 · 2.4 MB</span></div></div></aside></section></main>
    <script>document.querySelectorAll('.tool-group button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tool-group button').forEach(item=>item.classList.remove('is-active'));button.classList.add('is-active')}));document.querySelector('#create').addEventListener('click',()=>document.querySelector('.node.current').classList.toggle('current'));</script>
  </body>
</html>
