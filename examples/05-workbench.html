<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass · 工作台</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      :root { color-scheme: light; color: #17202a; background: #e8e4db; } body { min-height: 170vh; overflow-x: hidden; background: #e8e4db; }
      .canvas { position: fixed; z-index: -1; inset: 0; background: linear-gradient(90deg, rgba(49,94,111,.13) 1px, transparent 1px), linear-gradient(rgba(49,94,111,.13) 1px, transparent 1px), radial-gradient(circle at 80% 15%, #fcbd83 0 7%, transparent 26%), radial-gradient(circle at 12% 72%, #84c5bf 0 9%, transparent 34%), #f4f0e8; background-size: 32px 32px, 32px 32px, auto, auto, auto; }
      .shell { width: min(1240px, calc(100% - 48px)); margin: 0 auto; padding: 30px 0 100px; }.header { display: flex; align-items: center; justify-content: space-between; gap: 18px; color: #34414a; }.header h1 { margin: 0; font-size: 18px; letter-spacing: -.02em; }.header p { margin: 0; font-size: 13px; }.canvas-title { margin: 80px 0 30px; }.canvas-title p { margin: 0 0 8px; color: #607079; font-size: 14px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }.canvas-title h2 { max-width: 600px; margin: 0; font-size: clamp(44px, 7vw, 90px); letter-spacing: -.075em; line-height: .9; }
      .board { position: relative; min-height: 900px; margin: 26px 0 0; }.note { position: absolute; width: min(31vw, 275px); min-height: 170px; padding: 24px; box-shadow: 0 18px 28px rgba(53,64,68,.13); transition: box-shadow .18s ease, transform .18s ease; }.note p { margin: 0; font-size: 18px; font-weight: 640; line-height: 1.25; }.note small { display: block; margin-top: 38px; color: rgba(20,30,35,.65); }.note.one { top: 7%; left: 4%; transform: rotate(-4deg); background: #ffda98; }.note.two { top: 25%; right: 7%; transform: rotate(3deg); background: #a8d9d4; }.note.three { top: 54%; left: 22%; transform: rotate(2deg); background: #efb4a5; }.note.is-new { box-shadow: 0 0 0 4px rgba(20,86,104,.62), 0 18px 28px rgba(53,64,68,.13); transform: rotate(2deg) translateY(-8px); }.connector { position: absolute; height: 2px; background: #4b6570; transform-origin: left; opacity: .65; }.connector.a { top: 25%; left: 25%; width: 31%; transform: rotate(18deg); }.connector.b { top: 46%; left: 47%; width: 25%; transform: rotate(65deg); }.canvas-swatch { position: absolute; right: 18%; bottom: 12%; display: grid; grid-template-columns: repeat(4, 44px); gap: 9px; }.canvas-swatch i { display: block; width: 44px; height: 44px; border-radius: 50%; background: #f4c18b; }.canvas-swatch i:nth-child(2) { background: #78b9b4; }.canvas-swatch i:nth-child(3) { background: #df8e80; }.canvas-swatch i:nth-child(4) { background: #405a6a; }
      .toolbar { position: fixed; z-index: 3; top: 24px; left: 50%; width: min(690px, calc(100% - 48px)); --border-radius: 26px; transform: translateX(-50%); color: #1c2930; }.toolbar .liquid_glass-content { display: flex; align-items: center; min-height: 58px; padding: 7px; }.tool-group { display: flex; min-width: 0; flex: 1; }.tool-group button, .create { min-height: 44px; border: 0; background: transparent; color: inherit; font-weight: 660; }.tool-group button { flex: 1; border-radius: 18px; }.tool-group button:hover, .tool-group button.is-active { background: rgba(255,255,255,.48); }.tool-group button:active, .create:active { transform: scale(.96); }.create { display: inline-flex; align-items: center; gap: 7px; padding: 0 17px; border-radius: 18px; background: rgba(25,40,47,.88); color: #fff; }.create span { font-size: 20px; line-height: 1; }
      button:focus-visible { outline: 3px solid #173e51; outline-offset: 3px; } @media (max-width: 700px) { .shell { width: min(100% - 30px, 620px); }.header { padding-top: 5px; }.canvas-title { margin-top: 104px; }.toolbar { top: 12px; width: calc(100% - 24px); }.tool-group button { font-size: 12px; }.create { padding: 0 12px; font-size: 0; }.create span { font-size: 20px; }.board { min-height: 760px; }.note { width: min(60vw, 250px); }.note.one { left: 0; }.note.two { top: 31%; right: 0; }.note.three { top: 60%; left: 8%; }.canvas-swatch { right: 4%; bottom: 3%; } }
    </style>
  </head>
  <body>
    <svg class="liquid-filter" aria-hidden="true"><defs><filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feDisplacementMap scale="200" /></filter></defs></svg><div class="canvas" aria-hidden="true"></div>
    <section class="toolbar liquid_glass-wrapper" data-glass-shape="rounded" data-glass-tone="light" aria-label="工作台工具栏"><div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div><div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div><div class="liquid_glass-content"><nav class="tool-group" aria-label="视图"><button class="is-active" type="button">画布</button><button type="button">资料</button><button type="button">标注</button></nav><button class="create" id="create" type="button"><span>＋</span>新建</button></div></section>
    <main class="shell"><header class="header"><h1>春季内容工作台</h1><p>3 个想法 · 自动保存</p></header><section class="canvas-title"><p>Idea map / Week 19</p><h2>让相关的想法<br>彼此看得见。</h2></section><section class="board" aria-label="想法画布"><article class="note one"><p>首页不是展示所有内容，而是把当前选择讲清楚。</p><small>体验原则 · 01</small></article><i class="connector a"></i><article class="note two"><p>把筛选变成清晰的上下文，而不是第二套导航。</p><small>结构 · 02</small></article><i class="connector b"></i><article class="note three"><p>让封面图决定情绪，界面则保持克制。</p><small>视觉 · 03</small></article><div class="canvas-swatch" aria-label="项目颜色"><i></i><i></i><i></i><i></i></div></section></main>
    <script>document.querySelectorAll('.tool-group button').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.tool-group button').forEach(item=>item.classList.remove('is-active'));button.classList.add('is-active')}));document.querySelector('#create').addEventListener('click',()=>document.querySelector('.note.three').classList.toggle('is-new'));</script>
  </body>
</html>
