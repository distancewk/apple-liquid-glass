<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>隐私概览 — Apple Liquid Glass 案例</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      :root { color-scheme: light; --ink: #1d1d1f; --muted: rgba(29,29,31,.62); --blue: #0071e3; }
      body { min-height: 145vh; color: var(--ink); background: radial-gradient(circle at 10% 8%, rgba(194,220,230,.72), transparent 24%), radial-gradient(circle at 93% 24%, rgba(240,204,205,.55), transparent 28%), linear-gradient(135deg, #f5f5f2, #edf1ef 55%, #e8ebf0); }
      .page { width: min(720px, calc(100% - 32px)); margin: 0 auto; padding: 56px 0 150px; }
      .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .back { display: grid; min-width: 44px; min-height: 44px; place-items: center; border: 0; border-radius: 50%; color: var(--ink); background: rgba(255,255,255,.68); font-size: 28px; line-height: 1; text-decoration: none; }
      .back:focus-visible, .privacy-action:focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
      .topline small { color: var(--muted); }
      h1 { margin: 46px 0 12px; font-size: clamp(40px, 7vw, 64px); font-weight: 600; letter-spacing: -.07em; line-height: .96; }
      .lead { max-width: 540px; margin: 0; color: var(--muted); font-size: 17px; }
      .lead a { color: var(--blue); text-underline-offset: 3px; }
      .groups { display: grid; gap: 18px; margin-top: 38px; }
      .group { padding: 28px; border-radius: 30px; background: rgba(255,255,255,.78); box-shadow: 0 12px 32px rgba(30,35,38,.08), inset 0 1px 0 white; }
      .group:nth-child(2) { width: calc(100% - 64px); margin-left: auto; border-radius: 12px 30px 30px; }
      .group:nth-child(3) { width: calc(100% - 28px); border-radius: 30px 12px 30px 30px; }
      .group-head { display: flex; align-items: center; gap: 14px; }
      .group-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 50%; color: var(--blue); background: rgba(0,113,227,.1); font-size: 22px; }
      .group h2 { margin: 0; font-size: 20px; letter-spacing: -.035em; }
      .group > p { margin: 15px 0 20px; color: var(--muted); }
      .items { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 18px; padding: 0; margin: 0; list-style: none; }
      .items li { display: flex; align-items: center; gap: 9px; font-size: 14px; }
      .items li::before { content: "•"; color: var(--blue); font-size: 20px; line-height: 1; }
      .privacy-action { min-height: 44px; margin-top: 24px; padding: 0; border: 0; color: var(--blue); background: transparent; font-weight: 600; }
      .bottom-wrap { position: fixed; right: 0; bottom: max(16px, env(safe-area-inset-bottom)); left: 0; z-index: 10; display: flex; justify-content: center; pointer-events: none; }
      .bottom-bar { width: min(430px, calc(100% - 32px)); --border-radius: 26px; min-height: 66px; pointer-events: auto; }
      .bottom-bar .liquid_glass-content { display: grid; grid-template-columns: repeat(3, 1fr); align-items: center; width: 100%; padding: 7px; }
      .tab { min-height: 50px; border: 0; border-radius: 18px; color: rgba(29,29,31,.62); background: transparent; font-size: 12px; }
      .tab[aria-current="page"] { color: var(--ink); background: rgba(255,255,255,.44); font-weight: 600; }
      .tab:active { transform: scale(.97); }
      .status { min-height: 20px; margin: 20px 0 0; color: var(--muted); font-size: 13px; }
      html[data-glass-mode="fallback"] .bottom-bar { background: rgba(255,255,255,.92); }
      @supports not ((backdrop-filter: url(#liquid_glass_filter)) or (-webkit-backdrop-filter: url(#liquid_glass_filter))) { .bottom-bar { background: rgba(255,255,255,.92); } }
      @media (prefers-reduced-transparency: reduce) { .bottom-bar { background: rgba(255,255,255,.96); } }
      @media (max-width: 520px) { .page { width: calc(100% - 28px); padding-top: 28px; } .group { padding: 23px; } .group:nth-child(2), .group:nth-child(3) { width: 100%; margin-left: 0; } .items { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <svg class="liquid-filter" style="display:none" aria-hidden="true"><defs><filter id="liquid_glass_filter" x="0%" y="0%" width="100%" height="100%" filterUnits="objectBoundingBox"><feDisplacementMap scale="200" /></filter></defs></svg>
    <main class="page" aria-labelledby="privacy-title">
      <div class="topline"><a class="back" href="../README.md" aria-label="返回案例说明">‹</a><small>账户与隐私</small></div>
      <h1 id="privacy-title">隐私概览</h1>
      <p class="lead">你可以查看哪些信息会与你的账户关联，并随时调整授权范围。<a href="#policy">了解隐私政策</a></p>
      <div class="groups">
        <section class="group" aria-labelledby="group-data"><div class="group-head"><span class="group-icon" aria-hidden="true">⌁</span><h2 id="group-data">账户关联的数据</h2></div><p>这些信息帮助你在不同设备上保持工作连续。</p><ul class="items"><li>邮箱地址</li><li>偏好设置</li><li>已保存项目</li><li>设备名称</li></ul><button class="privacy-action" type="button">查看数据详情</button></section>
        <section class="group" aria-labelledby="group-control"><div class="group-head"><span class="group-icon" aria-hidden="true">◌</span><h2 id="group-control">由你控制</h2></div><p>关闭同步后，新内容只会保留在当前设备。</p><ul class="items"><li>跨设备同步</li><li>使用情况分析</li></ul><button class="privacy-action" type="button">管理授权</button></section>
        <section class="group" id="policy" aria-labelledby="group-help"><div class="group-head"><span class="group-icon" aria-hidden="true">i</span><h2 id="group-help">需要更多说明？</h2></div><p>我们会在请求数据前说明用途。你可以拒绝不需要的请求，核心阅读与本地整理不会受影响。</p><button class="privacy-action" type="button">联系支持</button></section>
      </div>
      <p class="status" role="status" aria-live="polite"></p>
    </main>
    <nav class="bottom-wrap" aria-label="账户区域"><div class="liquid_glass-wrapper bottom-bar"><div class="liquid_glass-outer"></div><div class="liquid_glass-cover"></div><div class="liquid_glass-sharp"></div><div class="liquid_glass-reflect"></div><div class="liquid_glass-content"><button class="tab" type="button">账户</button><button class="tab" type="button" aria-current="page">隐私</button><button class="tab" type="button">帮助</button></div></div></nav>
    <script>
      const status = document.querySelector('.status'); document.querySelectorAll('.privacy-action').forEach((button) => button.addEventListener('click', () => { status.textContent = `“${button.textContent.trim()}”是此案例中的可见操作反馈。`; })); document.querySelectorAll('.tab').forEach((button) => button.addEventListener('click', () => { document.querySelectorAll('.tab').forEach((tab) => tab.removeAttribute('aria-current')); button.setAttribute('aria-current', 'page'); status.textContent = `已切换到“${button.textContent.trim()}”。`; }));
    </script>
  </body>
</html>
