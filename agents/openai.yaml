interface:
  display_name: "Apple Liquid Glass"
  short_description: "Apple-like UI with restrained four-layer SVG glass"
  default_prompt: "Use $apple-liquid-glass to classify the page task and controls, read references/apple-hig.md plus references/hig-foundations.md, then load only the matching Pattern, Component/Input, and Technology guides. Write one compact page brief with the HIG route, semantic color roles, functional glass map, recovery/trust boundaries, and adaptation needs. Build one representative preview with the exact four-layer SVG reference material; a scrollable page must show content changing behind an anchored control, while a non-scrollable page must prove resting translucency without synthetic scrolling. Show the preview for approval before expanding. If target-browser evidence shows no rim displacement, set data-glass-mode=fallback and record the engine; do not invent another glass renderer. After expansion, run the Final Apple Conformance Review in references/verification.md and do not report completion while any item is failed or unverified."
