interface:
  display_name: "Apple Liquid Glass"
  short_description: "Strict Apple UI with restrained four-layer SVG glass"
  default_prompt: "Use $apple-liquid-glass in its strict Apple profile. First read references/strict-apple-profile.md, then the routing, planes, and shape sections in references/apple-hig.md plus the applicable sections in references/hig-foundations.md. Keep neutral interface surfaces, system-like typography, one application tint, familiar controls, and functional glass; colorful media is permitted only as named content and cannot redefine the UI. Choose preview by default, full only when the user explicitly asks to complete the page, or iterate for a scoped revision. Write one compact page brief with the HIG route, interaction class for each control, semantic color roles, functional glass map, recovery/trust boundaries, and adaptation needs. Before composition, run the reference fixture in the target browser and record whether the rim is visibly displaced; select reference or data-glass-mode=fallback from visual evidence, not computed style. Build a representative slice with the exact four-layer material. A scrollable page must show real content changing behind an anchored control. In preview mode, show evidence and wait for approval; in full mode, record the same evidence and continue. After expansion, run both levels of references/verification.md, the strict review, and the Final Apple Conformance Review; do not report completion while any required item is failed or unverified."
