interface:
  display_name: "Apple Liquid Glass"
  short_description: "Apple-like UI with restrained four-layer SVG glass"
  default_prompt: "Use $apple-liquid-glass to choose a delivery mode: preview by default, full only when the user explicitly asks to complete the page, or iterate for a scoped revision. Read the routing, planes, and shape sections in references/apple-hig.md plus the applicable sections in references/hig-foundations.md, then load only matching Pattern, Component/Input, and Technology guides. Write one compact page brief with the HIG route, interaction class for each control, semantic color roles, functional glass map, recovery/trust boundaries, and adaptation needs. Before composition, run the reference fixture in the target browser and record whether the rim is visibly displaced; select reference or data-glass-mode=fallback from visual evidence, not computed style. Build a representative slice with the exact four-layer material. A scrollable page must show content changing behind an anchored control; a non-scrollable page must prove resting translucency without synthetic scrolling. In preview mode, show evidence and wait for approval; in full mode, record the same evidence and continue. After expansion, run both the structural and browser-behavior levels of references/verification.md, then run the Final Apple Conformance Review; do not report completion while any required item is failed or unverified."
